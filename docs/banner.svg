<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17171a"/>
      <stop offset="1" stop-color="#26262c"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>

  <!-- Logo mark -->
  <g transform="translate(72 92)">
    <rect width="96" height="96" rx="24" fill="#0f0f12" stroke="#facc15" stroke-opacity="0.35"/>
    <path transform="scale(3)" d="M18 5 8 18.5h7.4L14 27l10.5-14h-7.6L18 5Z" fill="#facc15"/>
  </g>

  <!-- Wordmark -->
  <text x="72" y="248" fill="#fafafa" font-size="64" font-weight="700" letter-spacing="-1.5">TripShock</text>
  <text x="74" y="290" fill="#a1a1aa" font-size="24">Change one thing in your trip. See everything it touches.</text>

  <!-- Mini trip diff -->
  <g transform="translate(700 64)" font-size="17">
    <rect width="428" height="232" rx="16" fill="#0f0f12" stroke="#3f3f46"/>
    <text x="24" y="38" fill="#a1a1aa" font-size="14" letter-spacing="1.5">WHAT IF · LEAVE ONE DAY LATER</text>

    <rect x="16" y="56" width="396" height="34" rx="6" fill="#3f1d1d" fill-opacity="0.6"/>
    <text x="28" y="79" fill="#f87171" font-family="Consolas, Menlo, monospace">-  DEL → SIN   10 Nov   ₹21,400</text>

    <rect x="16" y="94" width="396" height="34" rx="6" fill="#14341f" fill-opacity="0.7"/>
    <text x="28" y="117" fill="#4ade80" font-family="Consolas, Menlo, monospace">+  DEL → SIN   11 Nov   ₹19,850</text>

    <rect x="16" y="132" width="396" height="34" rx="6" fill="#14341f" fill-opacity="0.7"/>
    <text x="28" y="155" fill="#4ade80" font-family="Consolas, Menlo, monospace">+  Hotel SIN   11–14 Nov ₹20,400</text>

    <rect x="16" y="170" width="396" height="34" rx="6" fill="#3b300c" fill-opacity="0.7"/>
    <text x="28" y="193" fill="#facc15" font-family="Consolas, Menlo, monospace">!  Temple closed on new date</text>
  </g>
</svg>
